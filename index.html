<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess Master TS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">

    <div id="board"></div>

    <div id="scoreboard" class="scoreboard">

        <div class="clock-section">
            <div class="timer-box" id="timer-white-box">
                <span class="timer-label">White:</span>
                <span id="timer-white" class="timer-digits">05:00</span>
            </div>
            <div class="timer-box" id="timer-black-box">
                <span class="timer-label">Black:</span>
                <span id="timer-black" class="timer-digits">05:00</span>
            </div>
        </div>

        <div class="status-section">
            <h3>Хід: <span id="current-player-turn" class="turn-white">White</span></h3>
        </div>

        <div class="captured-section">
            <h4>Збиті фігури:</h4>
            <div id="captured-white" class="captured-box"></div>
            <div id="captured-black" class="captured-box"></div>
        </div>

        <div class="history-section">
            <h4>Історія ходів:</h4>
            <div id="moves-log" class="moves-log"></div>
        </div>

        <div class="theme-section">
            <h4>Стиль дошки:</h4>
            <select id="theme-select" class="theme-dropdown">
                <option value="classic">Класична (Зелена)</option>
                <option value="dark">Темна (Матова)</option>
                <option value="neon">Кіберпанк (Неон)</option>
                <option value="wood">Дерев'яна (Ретро)</option>
            </select>
        </div>

        <button id="restart-btn" class="restart-button">Почати заново</button>

        <div class="analytics-section">
            <h4>Статистика матчу:</h4>
            <div class="analytics-box">
                <div>Найактивніша фігура: <span id="stat-active-piece" class="stat-val">-</span></div>
                <div>Середній час Білих: <span id="stat-white-time" class="stat-val">0с</span></div>
                <div>Середній час Чорних: <span id="stat-black-time" class="stat-val">0с</span></div>
                <div>Кількість шахів: <span id="stat-checks" class="stat-val">0</span></div>
            </div>
        </div>
    </div>
</div>

<div id="promotion-modal" class="modal hidden">
    <div class="modal-content">
        <h3>Оберіть фігуру</h3>
        <div id="promotion-options" class="promotion-pieces"></div>
    </div>
</div>
<script type="module" src="./dist/index.js"></script>
</body>
</html>
